global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pushgateway
    honor_labels: true # keep artifact/vuln_severity labels exactly as vulnreport pushed them
    static_configs:
      - targets: ["pushgateway:9091"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
