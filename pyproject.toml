[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreport"
version = "0.1.0"
description = "Turn Trivy scan results into SLA-aware vulnerability reports and Prometheus metrics"
requires-python = ">=3.11"
dependencies = [] # stdlib only: nothing extra to patch in the tool that tracks patching

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.17"]

[project.scripts]
vulnreport = "vulnreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=vulnreport --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
