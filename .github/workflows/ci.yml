name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: vulnreport (lint + tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  rules:
    name: alert rules + dashboards as code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p" -w /p --entrypoint promtool \
            prom/prometheus:v3.16.0 check rules rules/*.yaml
      - name: promtool test rules (alert unit tests)
        run: |
          docker run --rm -v "$PWD/observability/prometheus:/p" -w /p/tests --entrypoint promtool \
            prom/prometheus:v3.16.0 test rules *.yaml
      - name: Grafana dashboards are up to date with the generator
        run: python3 observability/grafana/build_dashboards.py --check
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

  security:
    name: secrets + config scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy fs + config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy-fs

  smoke:
    name: end-to-end on the compose stack
    needs: [python, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate a throwaway Grafana admin password
        run: |
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          echo "GRAFANA_ADMIN_PASSWORD=$pw" >>"$GITHUB_ENV"
      - name: Start Prometheus, Alertmanager, Pushgateway, Loki, Grafana
        run: docker compose up -d --wait
      - run: ./scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
