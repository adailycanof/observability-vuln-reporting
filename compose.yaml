# Local stack: Prometheus + Alertmanager + Pushgateway + Loki + Grafana, all
# provisioned from this repo. Ports bind to 127.0.0.1 only.
name: secobs

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 20

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.35.1
    command: [--config.file=/etc/alertmanager/alertmanager.yml, --storage.path=/alertmanager]
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager:/alertmanager
    ports: ["127.0.0.1:9093:9093"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/ready"]
      interval: 5s
      retries: 20

  pushgateway:
    <<: *hardening
    image: prom/pushgateway:v1.11.5
    ports: ["127.0.0.1:9091:9091"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/ready"]
      interval: 5s
      retries: 20

  loki:
    <<: *hardening
    image: grafana/loki:3.7.10
    command: [-config.file=/etc/loki/config.yaml]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - ./observability/loki/rules:/etc/loki/rules:ro
      - loki:/loki
    ports: ["127.0.0.1:3100:3100"]
    # no healthcheck: the image has no shell tools; scripts/smoke-test.sh polls /ready

  grafana:
    <<: *hardening
    image: grafana/grafana:13.3.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/vulnerability-management.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    tmpfs: [/tmp]
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 30

volumes:
  prometheus:
  alertmanager:
  loki:
  grafana:
