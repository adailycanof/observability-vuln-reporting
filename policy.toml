# Remediation SLAs (days from CVE publication, fixable findings only)
[sla_days]
critical = 7
high = 30
medium = 90
low = 180

# Time-boxed risk acceptances. Each needs an owner, a reason and an expiry.
# Expired entries stop suppressing findings and raise RiskAcceptanceExpired.
#
# [[accept]]
# id = "CVE-2026-12345"
# artifact = "ghcr.io/example/app:*"
# reason = "Vulnerable code path not reachable: feature X disabled (SEC-123)"
# owner = "app-team"
# expires = 2027-01-31
